[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".temp", "models"]

[tool.ruff.lint]
# 先建立确定性基础门禁：语法/导入/未定义/歧义与高风险格式；后续再分批启用更多规则。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 包入口承担兼容再导出；测试/工具先执行 bootstrap/path/env 设置再导项目模块。
"**/__init__.py" = ["F401"]
"tests/*.py" = ["E402"]
"tools/*.py" = ["E402"]
"e2e/*.py" = ["E402"]
