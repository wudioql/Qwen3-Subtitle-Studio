[pytest]
# Qwen3-Subtitle-Studio 测试门禁
#   pytest -q                → 全套自动套件（数量随用例增减；不依赖模型/GPU/FFmpeg/显示）
#   pytest -q -m logic       → 仅纯逻辑（无 Qt）
#   pytest -q -m ui          → 仅 Qt 离屏组件测试
#   env 级别（真模型/GPU/FFmpeg 验收）不在本套件内：见 e2e/ 与 tools/ 目录。
testpaths = tests
markers =
    logic: 纯逻辑测试（零 Qt、零重依赖）
    ui: Qt 离屏组件测试（QApplication offscreen）
    env: 需真实模型/GPU/FFmpeg 环境（占位标记；此类内容在 e2e/ 与 tools/，不被自动收集）
